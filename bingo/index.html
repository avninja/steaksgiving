<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steaksgiving Bingo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
<style>
  :root{--red:#8b1e1e;--red2:#a52a2a;--cream:#fbf5ec;--tan:#e8d9c4;--dark:#2b1a14;--ok:#2e7d32;--muted:#8a7a6c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--cream);color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100%}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  h1{color:var(--red);font-size:22px;letter-spacing:.5px;margin:0;text-align:center}
  .wrap{max-width:560px;margin:0 auto;padding:12px 10px 90px}
  .card{background:#fff;border:1px solid var(--tan);border-radius:12px;padding:14px;margin:10px 0}
  button{font:inherit;border:0;border-radius:10px;padding:14px 18px;font-weight:700;cursor:pointer}
  .btn{background:var(--red);color:#fff;width:100%;font-size:18px}
  .btn:disabled{background:#c9b8a6;color:#fff}
  .btn.sec{background:var(--tan);color:var(--dark)}
  input{font:inherit;width:100%;padding:14px;border:2px solid var(--tan);border-radius:10px;font-size:18px;background:#fff}
  .callbar{background:var(--red);color:#fff;border-radius:12px;padding:12px 14px;text-align:center;margin:8px 0}
  .callbar .lbl{font-size:12px;opacity:.85;letter-spacing:1px}
  .callbar .cur{font-size:18px;font-weight:700;margin-top:2px;opacity:.95}
  .callbar .cur small{display:block;font-size:30px;font-weight:900;letter-spacing:1px;opacity:1;line-height:1.1}
  .hist{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
  .hist::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}
  .board{display:grid;grid-template-columns:34px repeat(5,minmax(0,1fr));gap:3px;margin-top:10px;width:100%}
  .hd{background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:8px 1px;text-align:center;line-height:1.1;overflow-wrap:anywhere;min-width:0}
  .rl{background:var(--tan);font-size:8px;font-weight:800;border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px 1px;line-height:1.1;overflow-wrap:anywhere;min-width:0}
  .sq{background:#fff;border:1.5px solid var(--dark);border-radius:6px;min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9.5px;font-weight:700;padding:3px 1px;line-height:1.15;user-select:none;position:relative;overflow-wrap:break-word;min-width:0;letter-spacing:-.01em}
  .sq.long{font-size:8.5px;letter-spacing:-.03em}
  .board{grid-template-columns:38px repeat(5,minmax(0,1fr))}
  .rl{font-size:7.5px}
  @media (min-width:400px){.sq{font-size:11px}.sq.long{font-size:9.5px}.hd{font-size:11px}.rl{font-size:9px}.board{grid-template-columns:44px repeat(5,minmax(0,1fr))}}
  @media (min-width:480px){.sq{font-size:12px}}
  .sq.on{background:var(--red);color:#fff;border-color:var(--red)}
  .sq.free{background:var(--red);color:#fff;border-color:var(--red);font-size:12px}
  .freemoji{font-size:1.5em;line-height:1.15}
  .sq.called::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .sq.on.called::after{background:#fff}
  .sq.bad{box-shadow:inset 0 0 0 3px #ffb300}
  .fixed{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--cream) 30%)}
  .fixed .btn{max-width:540px;margin:0 auto;display:block;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .claim{border-left:5px solid #ffb300;padding-left:10px;margin:10px 0}
  .claim.verified{border-color:var(--ok)}
  .claim.rejected{border-color:#999;opacity:.6}
  .big{font-size:26px;font-weight:700;text-align:center;line-height:1.1;padding:14px 0}
  .big small{display:block;font-size:46px;font-weight:900;letter-spacing:1px;margin-bottom:4px}
  .roster{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--tan)}
  .roster:last-child{border-bottom:0}
  .roster button{padding:8px 12px;font-size:13px;background:var(--tan);color:var(--dark)}
  .roster .rm{color:var(--muted);text-decoration:line-through}
  /* marbled steak backdrop on phone screens (TV mode keeps its plain red, see body.tv below) */
  html{background:#5e0d12}
  body:not(.tv){min-height:100vh;background:linear-gradient(rgba(40,6,8,.28),rgba(40,6,8,.28)),url(../img/marbling.jpg) 0 0/640px repeat #5e0d12}
  body:not(.tv) h1,body:not(.tv) h2{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  body:not(.tv) .wrap>.muted:not(.card),body:not(.tv) .legend{color:#fff;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  body:not(.tv) .callbar{border:3px solid var(--cream);box-shadow:0 6px 18px rgba(0,0,0,.35)}
  body:not(.tv) .card{box-shadow:0 4px 14px rgba(0,0,0,.25)}
  body:not(.tv) .wrap>.board{background:var(--cream);padding:6px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  body:not(.tv) .claim.rejected{opacity:1;background:#efe7dd}
  body:not(.tv) .claim.rejected>*{opacity:.65}
  body:not(.tv) .fixed{background:linear-gradient(transparent,rgba(40,6,8,.85) 35%)}
  /* TV mode */
  body.tv{background:linear-gradient(rgba(40,6,8,.3),rgba(40,6,8,.3)),url(../img/marbling.jpg) 0 0/900px repeat #5e0d12;color:#fff;overflow:hidden}
  html:has(body.tv){background:#5e0d12}
  body.tv .wrap{max-width:none;padding:0;height:100vh;display:flex;flex-direction:column}
  .tvtop{display:flex;justify-content:space-between;align-items:center;padding:2vh 3vw;font-size:3vh;font-weight:700;letter-spacing:.1em;background:rgba(30,5,7,.82);box-shadow:0 .5vh 2vh rgba(0,0,0,.35)}
  .tvmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 4vw}
  .tvpanel{background:rgba(30,5,7,.82);border-radius:3vh;padding:4vh 6vw;box-shadow:0 1vh 4vh rgba(0,0,0,.45);max-width:92vw}
  .tvsteak{font-size:18vh;font-weight:900;letter-spacing:.04em;line-height:1}
  .tvtop2{font-size:9vh;font-weight:700;margin-top:3vh;line-height:1.1}
  .tvwait{font-size:8vh;font-weight:700;opacity:.9}
  .tvwin{background:var(--ok);font-size:7vh;font-weight:900;padding:2vh 4vw;border-radius:2vh;margin-top:4vh}
  .tvhist{display:flex;flex-wrap:wrap;justify-content:center;gap:1.5vh 1.5vw;padding:2vh 3vw 3vh;white-space:nowrap}
  .hasqr .tvhist{padding-left:calc(2.5vw + 27vh)}
  .tvhist span{background:rgba(30,5,7,.85);box-shadow:0 .4vh 1.2vh rgba(0,0,0,.35);border-radius:999px;padding:1vh 2vw;font-size:3vh;font-weight:700;flex:0 0 auto}
  .tvhist span b{opacity:.75;font-weight:800;margin-right:.6vw}
  .tvqr{position:fixed;left:2.5vw;bottom:3vh;background:#fff;color:var(--dark);border-radius:2vh;padding:1.6vh;text-align:center;font-weight:800;font-size:2.4vh;line-height:1.25;box-shadow:0 1vh 3vh rgba(0,0,0,.35)}
  .tvqr svg{display:block;width:20vh;height:20vh;margin:0 auto 1vh}
  .tvqr small{display:block;font-weight:600;font-size:1.8vh;opacity:.7}
  .closed{text-align:center;padding:26px 18px}
  .closed .big{font-size:22px;padding:6px 0 10px}
  .tvwelcome{white-space:nowrap;font-size:min(13vh,6.4vw);font-weight:900;letter-spacing:.03em;line-height:1.05;margin-top:1vh}
  .tvwsub{font-size:4.6vh;font-weight:600;line-height:1.3;margin-top:3vh;opacity:.92}
  .tvbingo{font-size:5vh;font-weight:900;letter-spacing:.2em;opacity:.6}
  .tvsnd{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:4vh;padding:3vh 5vw;background:#fff;color:var(--red);border-radius:2vh;box-shadow:0 1vh 4vh rgba(0,0,0,.4)}
  .winner{background:var(--ok);color:#fff;border-radius:12px;padding:14px;text-align:center;font-weight:800;font-size:20px;margin:8px 0}
  .toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  .center{text-align:center}
  ol{padding-left:20px;margin:6px 0}
  .legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:4px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center muted" style="padding:40px 0">Loading…</div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const SB_URL = "https://ntmbifttgdguxifgbrcc.supabase.co";
const SB_KEY = "sb_publishable_8gHqh_eoL7Io2-3QvJ2kcA_2VB-C_7W";
const sb = supabase.createClient(SB_URL, SB_KEY);

const STEAKS = ["RIBEYE","NY STRIP","FILET","SIRLOIN","T-BONE"];
const ROWS = ["RARE","MED RARE","MEDIUM","MED WELL","WELL DONE"];
const app = document.getElementById("app");
const isHost = new URLSearchParams(location.search).has("host");
const isTV = new URLSearchParams(location.search).has("tv");
const joinName = new URLSearchParams(location.search).get("name");
let autoJoinTried = false;
const PLAY_URL = location.origin + location.pathname;
if(isTV) document.body.classList.add("tv");
let game = null, deck = null;
const toastEl = document.getElementById("toast");
function toast(m){ toastEl.textContent=m; toastEl.classList.add("show"); setTimeout(()=>toastEl.classList.remove("show"),2200); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const LINES = (()=>{ const L=[]; for(let r=0;r<5;r++)L.push([0,1,2,3,4].map(c=>r*5+c)); for(let c=0;c<5;c++)L.push([0,1,2,3,4].map(r=>r*5+c)); L.push([0,6,12,18,24]); L.push([4,8,12,16,20]); return L; })();
const lineName = i => i<5?`${ROWS[i]} row`: i<10?`${STEAKS[i-5]} column`:"diagonal";

async function loadGame(){
  const { data } = await sb.from("game").select("*").eq("id",1).single();
  game = data;
}
async function loadDeck(){
  const { data } = await sb.from("deck").select("*");
  deck = {}; STEAKS.forEach(s=>deck[s]=[]);
  data.forEach(d=>deck[d.steak].push(d.topping));
}
function calledSet(){ return new Set((game?.calls||[]).map(c=>c.steak+"|"+c.topping)); }
function makeBoard(){
  const b=[];
  for(let r=0;r<5;r++) b.push([]);
  STEAKS.forEach((s,c)=>{
    const pool=[...deck[s]];
    for(let r=0;r<5;r++){ const i=Math.floor(Math.random()*pool.length); b[r][c]=pool.splice(i,1)[0]; }
  });
  b[2][2]="FREE";
  return b;
}
function boardHTML(board, marks, called, badSet){
  let h='<div class="board"><div></div>'+STEAKS.map(s=>`<div class="hd">${s}</div>`).join("");
  for(let r=0;r<5;r++){
    h+=`<div class="rl">${ROWS[r]}</div>`;
    for(let c=0;c<5;c++){
      const i=r*5+c, t=board[r][c];
      if(t==="FREE"){ h+=`<div class="sq free"><span>FREE<br><span class="freemoji">🥩</span><br>STEAK</span></div>`; continue; }
      const cls=["sq"]; if(t.split(" ").some(w=>w.length>=12))cls.push("long"); if(marks[i])cls.push("on"); if(called.has(STEAKS[c]+"|"+t))cls.push("called"); if(badSet&&badSet.has(i))cls.push("bad");
      h+=`<div class="${cls.join(" ")}" data-i="${i}">${esc(t)}</div>`;
    }
  }
  return h+"</div>";
}
function callBarHTML(){
  const calls=game.calls||[], cur=calls[calls.length-1];
  const hist=calls.slice(0,-1).reverse().map(c=>`<span class="chip">${esc(c.steak)}: ${esc(c.topping)}</span>`).join("");
  return `<div class="callbar"><div class="lbl">ROUND ${game.round} · CALL ${calls.length} OF 75</div>
    <div class="cur">${cur?`<small>${esc(cur.steak)}</small>${esc(cur.topping)}`:"Waiting for the first call…"}</div>
    ${hist?`<div class="hist">${hist}</div>`:""}</div>`;
}
// Which lines are complete and fully called (free counts)
function winningLines(board, marks){
  const called=calledSet(), out=[];
  LINES.forEach((ln,li)=>{
    const ok=ln.every(i=>{ const r=Math.floor(i/5),c=i%5,t=board[r][c]; return t==="FREE"||(marks[i]&&called.has(STEAKS[c]+"|"+t)); });
    if(ok) out.push(li);
  });
  return out;
}

/* ---------------- PLAYER ---------------- */
let me = null;
function loadMe(){ try{ me=JSON.parse(localStorage.getItem("sg_player")||"null"); }catch{ me=null; } }
function saveMe(){ localStorage.setItem("sg_player", JSON.stringify(me)); }

async function joinScreen(){
  const prev = me?.name || localStorage.getItem("sg_name") || "";
  app.innerHTML=`<h1>🥩 STEAKSGIVING IV BINGO</h1>
    <div class="card"><p class="muted" style="margin-top:0">Enter your name to get a board. ${game.round>1?`Round ${game.round} just started, so everyone gets a fresh one.`:""}</p>
    <input id="nm" placeholder="Your first name" maxlength="24" value="${esc(prev)}" autocomplete="given-name">
    <div style="height:10px"></div><button class="btn" id="go">Deal me a board</button></div>
    <div class="card muted"><b>How it works</b><ol><li>The host calls a steak and a topping.</li><li>Find it in that steak's column and tap it.</li><li>Five in a row (any direction, the FREE 🥩 STEAK square counts) — hit BINGO.</li></ol></div>`;
  document.getElementById("go").onclick=async()=>{
    const name=document.getElementById("nm").value.trim();
    if(!name) return toast("Need a name");
    localStorage.setItem("sg_name", name);
    const board=makeBoard();
    const { data, error } = await sb.from("players").insert({name, round:game.round, board}).select().single();
    if(error) return toast(game.status==="open"?"Couldn't join, try again":"Steak Bingo isn't open right now");
    me={id:data.id,name,round:game.round,board,marks:Array(25).fill(false),claimed:false};
    saveMe(); playerScreen();
  };
  if(joinName && !autoJoinTried){
    autoJoinTried=true;
    history.replaceState(null,"",location.pathname);
    document.getElementById("nm").value=joinName.slice(0,24);
    document.getElementById("go").click();
  }
}
function closedScreen(){
  const ended=game.status==="ended";
  app.innerHTML=`<h1>🥩 STEAKSGIVING IV BINGO</h1>
    <div class="card closed">${ended
      ?`<div class="big">Thanks for playing Steak Bingo! 🥩</div><div class="muted">That's a wrap for tonight.</div>`
      :`<div class="big">Steak Bingo starts at the party.</div><div class="muted">Watch your RSVP for the <b>Join Steak Bingo</b> button. It shows up when the host starts the game.</div>`}
      <div style="height:14px"></div><a class="btn sec" style="display:block;text-decoration:none;text-align:center" href="../">Back to the RSVP page</a></div>`;
}
function playerScreen(){
  if(game.status!=="open") return closedScreen();
  if(!me || me.round!==game.round) return joinScreen();
  const called=calledSet();
  const wins=winningLines(me.board, me.marks);
  app.innerHTML=`<h1>🥩 STEAKSGIVING IV BINGO</h1>
    ${game.winner?`<div class="winner">🏆 ${esc(game.winner)} has BINGO! Round over.</div>`:""}
    ${callBarHTML()}
    <div class="muted center">${esc(me.name)}'s board · tap a square when it's called</div>
    ${boardHTML(me.board, me.marks, called)}
    <div class="legend"><span><i></i>called</span><span>Tap to mark · tap again to unmark</span></div>
    ${me.claimStatus==="verified"?`<div class="winner">🎉 Your BINGO is verified${game.winner&&game.winner!==me.name?" (but "+esc(game.winner)+" got there first)":""}!</div>`:me.claimStatus==="rejected"?`<div class="card" style="border-color:#ffb300"><b>Not yet.</b> One of your marked squares hasn't been called. Unmark it and keep playing.</div>`:""}
    <div class="fixed"><button class="btn" id="bingo" ${wins.length&&!game.winner&&me.claimStatus!=="verified"?"":"disabled"}>${game.winner?"Round over":me.claimStatus==="pending"?"Checking…":wins.length?"🎉 BINGO!":"BINGO (need 5 in a row)"}</button></div>`;
  app.querySelectorAll(".sq[data-i]").forEach(el=>el.onclick=()=>{ const i=+el.dataset.i; me.marks[i]=!me.marks[i]; if(me.claimStatus==="rejected") me.claimStatus=null; saveMe(); playerScreen(); });
  const b=document.getElementById("bingo");
  if(b && !b.disabled) b.onclick=async()=>{
    b.disabled=true;
    const { data, error } = await sb.from("claims").insert({player_id:me.id,name:me.name,round:game.round,board:me.board,marks:me.marks,line:wins.map(lineName).join(", ")}).select("id").single();
    if(error){ toast("Couldn't send, try again"); b.disabled=false; return; }
    me.claimed=true; me.claimStatus="pending"; me.claimId=data.id; saveMe(); playerScreen();
    for(let i=0;i<10;i++){
      await new Promise(r=>setTimeout(r,700));
      const { data: c } = await sb.from("claims").select("status").eq("id",me.claimId).single();
      if(c && c.status!=="pending"){ me.claimStatus=c.status; saveMe(); await loadGame(); playerScreen(); toast(c.status==="verified"?"BINGO confirmed! Shout it!":"Not a valid bingo yet"); return; }
    }
  };
}

/* ---------------- TV ---------------- */
// Moo sound. Browsers (iPhone especially) only allow audio after a tap on THIS
// page load. The tap plays a real moo through one <audio> element, which
// unlocks that element for the rest of the night; every later moo reuses it.
// (Plain media playback also isn't muted by the iPhone silent switch.)
// The tap button shows on every load and comes back if a moo is ever blocked.
const SOUND_VERSION="sound v5";
try{ localStorage.removeItem("sg_tv_sound"); }catch{}
try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch{}
const MOO_SRC=[1,2,3,4,5].map(i=>"moo/moo"+i+".mp3?v=5"); // bump ?v when the files change (phones cache them)
const mooEl=new Audio(); mooEl.preload="auto"; mooEl.setAttribute("playsinline","");
let soundOK=false, lastMoo=-1, lastWinKey;
function pickMoo(){ let i; do { i=Math.floor(Math.random()*MOO_SRC.length); } while(i===lastMoo && MOO_SRC.length>1); lastMoo=i; return MOO_SRC[i]; }
function playMoo(){
  mooEl.src=pickMoo(); mooEl.currentTime=0;
  const pr=mooEl.play();
  return (pr&&pr.then?pr:Promise.resolve()).then(()=>{ soundOK=true; syncSoundButton(); return true; })
    .catch(e=>{ soundOK=false; syncSoundButton(); toast("Sound blocked ("+(e&&e.name||"error")+"). Tap the cow button."); return false; });
}
function enableSound(){ playMoo(); }   // must run directly inside the tap
function moo(){ if(!soundOK){ syncSoundButton(); return false; } playMoo(); return true; }
function syncSoundButton(){
  if(!isTV) return;
  let v=document.getElementById("sndv");
  if(!v){ v=document.createElement("div"); v.id="sndv"; v.style.cssText="position:fixed;right:1vw;bottom:.6vh;font-size:1.4vh;opacity:.45;color:#fff;z-index:5"; document.body.appendChild(v); }
  v.textContent=SOUND_VERSION+(soundOK?" · on":" · off");
  let b=document.getElementById("snd");
  if(soundOK){ if(b) b.remove(); return; }
  if(!b){ b=document.createElement("button"); b.id="snd"; b.className="tvsnd"; b.textContent="🔊 Tap once to enable the cow"; b.onclick=enableSound; document.body.appendChild(b); }
}
function tvScreen(){
  // Moo once per new winner (per round). Don't moo for a winner already showing when the TV loads.
  const winKey=game.winner?game.round+"|"+game.winner:null;
  if(lastWinKey!==undefined && winKey && winKey!==lastWinKey) moo();
  lastWinKey=winKey;
  const calls=game.calls||[], cur=calls[calls.length-1];
  const hist=calls.slice(0,-1).reverse().slice(0,8).map(c=>`<span><b>${c.n}</b>${esc(c.steak)} · ${esc(c.topping)}</span>`).join("");
  const st=game.status;
  let qr="";
  if(st==="open" && typeof qrcode==="function"){ const q=qrcode(0,"M"); q.addData(PLAY_URL); q.make(); qr=q.createSvgTag({cellSize:4,margin:0,scalable:true}); }
  app.classList.toggle("hasqr", !!qr);
  if(st!=="open"){
    app.innerHTML=`<div class="tvtop"><span>🥩 STEAKSGIVING IV BINGO</span><span></span></div>
      <div class="tvmain"><div class="tvpanel">${st==="ended"
        ?`<div class="tvwelcome">🥩 STEAKSGIVING IV</div><div class="tvwsub">Steak your claim.</div>`
        :`<div class="tvbingo">STEAK BINGO</div><div class="tvwait">Starts soon…</div>`}</div></div>
`;
    syncSoundButton();
    return;
  }
  app.innerHTML=`<div class="tvtop"><span>🥩 STEAKSGIVING IV BINGO</span><span>ROUND ${game.round} · CALL ${calls.length} OF 75</span></div>
    ${qr?`<div class="tvqr">${qr}Scan to play<small>${esc(PLAY_URL.replace(/^https?:\/\//,""))}</small></div>`:""}
    <div class="tvmain"><div class="tvpanel">${cur?`<div class="tvsteak">${esc(cur.steak)}</div><div class="tvtop2">${esc(cur.topping)}</div>`:`<div class="tvbingo">STEAK BINGO</div><div class="tvwait">Waiting for the first call…</div>`}</div>
    ${game.winner?`<div class="tvwin">🏆 ${esc(game.winner)} has BINGO!</div>`:""}</div>
    <div class="tvhist">${hist}</div>`;
  syncSoundButton();
}

/* ---------------- HOST ---------------- */
// Hosts unlock this screen with their own RSVP link (saved on this device by the RSVP page).
let hostTok=null, hostOK=false, claims=[], players=[], playerCount=0;
try{ hostTok=JSON.parse(localStorage.getItem("sg_rsvp")||"null")?.token||null; }catch{ hostTok=null; }
function hostLogin(){
  app.innerHTML=`<h1>🥩 HOST SCREEN</h1><div class="card"><b>Hosts only</b>
    <p class="muted">Open your host RSVP link on this device first (the link from "Your edit link" on the RSVP page), then come back here.</p>
    <a class="btn" style="display:block;text-align:center;text-decoration:none" href="../">Go to the RSVP page</a></div>`;
}
async function refreshHost(){
  const [{ data: cl }, { data: pl }] = await Promise.all([
    sb.from("claims").select("*").eq("round",game.round).order("created_at",{ascending:true}),
    sb.from("players").select("id,name,created_at,removed").eq("round",game.round).order("created_at",{ascending:true})
  ]);
  claims=cl||[]; players=pl||[]; playerCount=players.filter(p=>!p.removed).length;
}
function hostScreen(){
  const calls=game.calls||[], cur=calls[calls.length-1], called=calledSet();
  const pending=claims.filter(c=>c.status==="pending");
  const st=game.status;
  app.innerHTML=`<h1>🥩 HOST · ROUND ${game.round}</h1>
    <div class="card"><b>Steak Bingo is ${st==="open"?"OPEN":st==="ended"?"closed for the night":"not started yet"}</b>
      <div class="muted" style="margin:4px 0 10px">${st==="open"?"Guests see a Join button on their RSVP, and the TV shows a QR code.":"Starting shows a Join button on every RSVP and opens boards."}</div>
      <button class="btn ${st==="open"?"sec":""}" id="bstat">${st==="open"?"Close Bingo":"▶ Start Bingo"}</button>
      <div class="row" style="margin-top:8px"><a class="btn sec" style="text-align:center;text-decoration:none;font-size:15px" href="../">RSVP page</a><a class="btn sec" style="text-align:center;text-decoration:none;font-size:15px" href="./?tv" target="_blank" rel="noopener">TV screen</a></div></div>
    ${game.winner?`<div class="winner">🏆 ${esc(game.winner)} wins round ${game.round}</div>`:""}
    <div class="callbar"><div class="lbl">CALL ${calls.length} OF 75 · ${playerCount} PLAYER${playerCount===1?"":"S"}</div>
      <div class="big">${cur?`<small>${esc(cur.steak)}</small>${esc(cur.topping)}`:"—"}</div></div>
    <div class="row"><button class="btn" id="next" ${calls.length>=75||game.winner?"disabled":""}>Next call</button><button class="btn sec" id="undo" ${calls.length?"":"disabled"}>Undo</button></div>
    <div style="height:8px"></div><button class="btn sec" id="newround">New round (reshuffles every board)</button>
    ${claims.length?`<h2 style="font-size:16px;margin:16px 0 4px">BINGO claims (auto-checked)</h2>`:""}
    ${claims.slice().reverse().map(c=>{
      const bad=new Set(); c.marks.forEach((m,i)=>{ if(!m) return; const r=Math.floor(i/5),col=i%5,t=c.board[r][col]; if(t!=="FREE"&&!called.has(STEAKS[col]+"|"+t)) bad.add(i); });
      const label=c.status==="verified"?"✅ Verified":c.status==="rejected"?"❌ Rejected (yellow squares were never called)":"⏳ Checking…";
      return `<div class="card claim ${c.status}"><b>${esc(c.name)}</b> · ${esc(c.line)}<div class="muted">${label}</div>
        ${boardHTML(c.board,c.marks,called,bad)}</div>`;
    }).join("")}
    <div class="card"><b>Players (${playerCount})</b>
      ${players.length?players.map(p=>`<div class="roster"><span class="${p.removed?"rm":""}">${esc(p.name)}<span class="muted"> · ${new Date(p.created_at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</span></span>${p.removed?`<span class="muted">removed</span>`:`<button data-k="${p.id}" data-n="${esc(p.name)}">Remove</button>`}</div>`).join(""):`<div class="muted">Nobody has joined yet</div>`}</div>
    <div class="card"><b>Called so far</b><div class="muted">${calls.slice().reverse().map(c=>`${c.n}. ${esc(c.steak)}: ${esc(c.topping)}`).join("<br>")||"Nothing yet"}</div></div>`;
  const act=async(fn,args,msg)=>{ const { error } = await sb.rpc(fn,{p_token:hostTok,...args}); if(error) toast(error.message); else if(msg) toast(msg); };
  document.getElementById("bstat").onclick=()=>{
    if(st==="open"){ if(confirm("Close Steak Bingo for the night? Join buttons disappear and boards close.")) act("host_bingo_status",{p_status:"ended"},"Bingo closed"); }
    else act("host_bingo_status",{p_status:"open"},"Steak Bingo is open!");
  };
  document.getElementById("next").onclick=()=>act("host_next_call",{});
  document.getElementById("undo").onclick=()=>act("host_undo_call",{},"Undid last call");
  document.getElementById("newround").onclick=()=>{ if(confirm("Start a new round? Clears calls and gives everyone a fresh board.")) act("host_new_round",{},"New round started"); };
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ if(confirm(`Remove ${b.dataset.n}? They can rejoin with a new board.`)) act("host_remove_player",{p_player:b.dataset.k},"Removed"); });
}

/* ---------------- BOOT ---------------- */
(async()=>{
  await Promise.all([loadGame(), loadDeck()]);
  loadMe();
  const render=()=> isTV ? tvScreen() : isHost ? (hostOK?hostScreen():hostLogin()) : playerScreen();
  sb.channel("live")
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"game"},async p=>{
      const prevRound=game.round; game=p.new;
      if(isHost && hostOK && (game.round!==prevRound)) await refreshHost();
      if(!isHost && !isTV && me && game.round!==prevRound){ me=null; localStorage.removeItem("sg_player"); }
      render();
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"claims"},async()=>{ if(isHost&&hostOK){ await refreshHost(); render(); } })
    .on("postgres_changes",{event:"*",schema:"public",table:"players"},async p=>{
      if(isHost&&hostOK){ await refreshHost(); render(); }
      else if(me && p.new && p.new.id===me.id && p.new.removed){ kicked(); }
    })
    .subscribe();
  function kicked(){ me=null; localStorage.removeItem("sg_player"); render(); toast("The host removed you. Join again to get a new board."); }
  // Safety net if realtime drops: refresh every 15s
  setInterval(async()=>{
    const prev=JSON.stringify(game); await loadGame();
    if(JSON.stringify(game)!==prev){ if(isHost&&hostOK) await refreshHost(); render(); }
    if(!isHost && !isTV && me && game.status==="open"){ const { data } = await sb.from("players").select("removed").eq("id",me.id).maybeSingle(); if(!data || data.removed) kicked(); }
  },15000);
  if(isHost && hostTok){ const { data } = await sb.rpc("host_check",{p_token:hostTok}); hostOK=!!data; if(hostOK) await refreshHost(); }
  render();
})();
</script>
