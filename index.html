<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steaksgiving IV · RSVP</title>
<meta property="og:title" content="Steaksgiving IV">
<meta property="og:description" content="Friday, Nov 27 at Gladiola Studio. RSVP and tell us what you're bringing.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
<style>
  :root{--red:#8b1e1e;--cream:#fbf5ec;--tan:#e8d9c4;--dark:#2b1a14;--ok:#2e7d32;--muted:#8a7a6c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#5e0d12;color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .wrap{max-width:560px;margin:0 auto;padding:16px 12px 40px}
  /* marbled steak backdrop (img/marbling.jpg is generated by img/marbling.py, tiles seamlessly) */
  body{background:linear-gradient(rgba(40,6,8,.28),rgba(40,6,8,.28)),url(img/marbling.jpg) 0 0/640px repeat #5e0d12;background-attachment:scroll}
  .hero{background:var(--red);color:#fff;border-radius:16px;padding:22px 12px;text-align:center;border:3px solid var(--cream);box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .hero h1{margin:0;font-size:30px;letter-spacing:1px;line-height:1.05}
  .hero .sub{opacity:.9;margin-top:6px;font-size:15px}
  .hero .when{margin-top:12px;font-size:17px;font-weight:700}
  h2{font-size:17px;margin:18px 0 8px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .card{box-shadow:0 4px 14px rgba(0,0,0,.25);background:#fff;border:1px solid var(--tan);border-radius:12px;padding:14px;margin:10px 0}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
  input,select{font:inherit;width:100%;padding:12px;border:2px solid var(--tan);border-radius:10px;font-size:17px;background:#fff;min-width:0}
  button{font:inherit;border:0;border-radius:10px;padding:13px 16px;font-weight:700;cursor:pointer}
  .btn{background:var(--red);color:#fff;width:100%;font-size:18px}
  a.btn{display:block;box-sizing:border-box;padding:13px 16px;border-radius:10px;font-weight:700;text-align:center;text-decoration:none}
  .btn:disabled{background:#c9b8a6}
  .sec{background:var(--tan);color:var(--dark)}
  .link{background:none;color:var(--red);text-decoration:underline;padding:6px 0;font-size:14px}
  .row{display:flex;gap:8px;align-items:center;margin-top:6px}
  .row input{flex:1}
  .row select{flex:0 0 142px}
  .x{flex:0 0 42px;height:46px;background:var(--tan);color:var(--dark);font-size:20px;line-height:1;padding:0}
  .muted{color:var(--muted);font-size:13px}
  .stats{display:flex;gap:8px;margin:12px 0}
  .stat{flex:1;background:#fff;border:1px solid var(--tan);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:26px;color:var(--red)}
  .stat span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px}
  .guest{padding:10px 0;border-bottom:1px solid var(--tan)}
  .guest:last-child{border-bottom:0}
  .guest .nm{font-weight:800;font-size:16px}
  .guest .plus{color:var(--muted);font-weight:600;font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{background:var(--cream);border:1px solid var(--tan);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
  .chip i{font-style:normal;color:var(--muted);font-weight:700;margin-right:4px;font-size:11px;letter-spacing:.5px}
  .mine{border-color:var(--red);border-width:2px}
  .ok{background:var(--ok);color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;text-align:center;margin:10px 0}
  .toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  .catsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .catsum div{background:#fff;border:1px solid var(--tan);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--muted);font-weight:700}
  .catsum div b{display:block;font-size:20px;color:var(--dark)}
  .hostrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hostrow .acts{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
  .hostrow .acts button{padding:7px 10px;font-size:12px}
  .arr{background:var(--ok)!important;color:#fff!important}
  .guest.arrived .nm::before{content:"✓ ";color:var(--ok)}
  .hostbar{background:var(--dark);color:#fff;border-radius:12px;padding:12px 14px;margin:10px 0}
  .hostbar b{font-size:15px}
  .hostbar .row2{display:flex;gap:8px;margin-top:10px}
  .hostbar .row2 button{flex:1;background:#fff;color:var(--dark);font-size:14px;padding:10px}
  .target{height:10px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden;margin-top:8px}
  .target i{display:block;height:100%;background:#fff}
  textarea{font:inherit;width:100%;padding:12px;border:2px solid var(--tan);border-radius:10px;font-size:15px;min-height:70px}
  pre.roster{background:#fff;color:var(--dark);border:1px solid var(--tan);border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;line-height:1.5;font-family:ui-monospace,Menlo,Consolas,monospace}
  .hnote{font-size:12px;color:#b36b00;font-weight:700;margin-top:4px}
  .hbadge{display:inline-block;background:var(--red);color:#fff;font-size:10px;font-weight:800;letter-spacing:.6px;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:2px}
  .bingo{border:2px solid var(--red)}
  .bingo .big{font-size:18px;font-weight:800;margin-bottom:4px}
  .hwarn{background:#fff3e0;border-radius:8px;padding:8px 10px;font-size:13px;color:#8a4b00;font-weight:600;margin-top:8px}
  .hostbar .row3{display:flex;gap:8px;margin-top:8px}
  .hostbar .row3 a,.hostbar .row3 button{flex:1;background:rgba(255,255,255,.14);color:#fff;font-size:14px;padding:10px;border-radius:10px;text-align:center;text-decoration:none;font-weight:700}
  .hostbar .row3 .go{background:var(--ok)}
  .warn{font-size:13px;color:#a35f00;font-weight:600;margin:4px 0 0}
  .warn:empty{display:none}
  .need{background:#fff7e8;border:1px solid #f0d9ae;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0 2px}
  .need b{color:var(--red)}
  .details div{margin-top:6px;font-size:15px}
  .details a{color:var(--red);font-weight:700}
  .flag{background:var(--cream);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
  .btnrow{display:flex;gap:8px;margin-top:10px}
  .btnrow button{flex:1;font-size:15px;padding:11px}
  @media print{.hero,.hostbar,.card.mine,h2,.stats,.catsum,.muted,.acts,button{display:none!important}pre.roster{border:0;font-size:14px}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap" id="app"><div style="text-align:center;padding:40px 0;color:#fff">Loading…</div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://ntmbifttgdguxifgbrcc.supabase.co", "sb_publishable_8gHqh_eoL7Io2-3QvJ2kcA_2VB-C_7W");
const CATS=["Main","Appetizer","Side","Bread","Dessert","Other"];
const app=document.getElementById("app"), toastEl=document.getElementById("toast");
const toast=m=>{ toastEl.textContent=m; toastEl.classList.add("show"); setTimeout(()=>toastEl.classList.remove("show"),2400); };
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let list=[], mine=null, editing=false;
// draft kept in memory while the form is open
let draft={name:"",guests:[],dishes:[]};
// host editing state
const TARGET=20; // invites
let hostEdit=null;   // {id|null, name, guests, dishes, host_note}
let showRoster=false;
// Hosts are RSVPs flagged is_host; their own RSVP link unlocks host tools.
const H=()=>!!mine?.is_host;
let bingo=null; // {status, round}
let declined=[]; // hosts only: RSVPs marked "can't make it"

// Event details. The street address is NOT in this file: it comes from the
// rsvp_event RPC, which only returns it for a valid RSVP token.
const EVENT={title:"Steaksgiving IV",when:"Friday, November 27 · 6–10 PM",start:"20261127T230000Z",end:"20261128T030000Z"};
let evt=null, editTok=null;

function loadMine(){
  // A personal edit link (?edit=<token>) adopts that RSVP on this device.
  const params=new URLSearchParams(location.search), tok=params.get("edit");
  editTok=tok;
  if(tok){
    if(/^[0-9a-f-]{36}$/i.test(tok)) localStorage.setItem("sg_rsvp",JSON.stringify({token:tok}));
    params.delete("edit"); const q=params.toString();
    history.replaceState(null,"",location.pathname+(q?"?"+q:"")+location.hash);
  }
  try{ mine=JSON.parse(localStorage.getItem("sg_rsvp")||"null"); }catch{ mine=null; }
}
async function loadEvent(){
  if(!mine?.token){ evt=null; return; }
  const { data } = await sb.rpc("rsvp_event",{p_token:mine.token});
  evt=data||null;
}
const editLink=()=>`${location.origin}${location.pathname}?edit=${mine.token}`;
const norm=s=>String(s||"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim().replace(/s\b/g,"");
function nameTaken(name){
  const n=norm(name); if(!n) return null;
  return list.find(r=>norm(r.name)===n && r.id!==mine?.id)||null;
}
function dishTaken(name){
  const n=norm(name); if(n.length<3) return null;
  for(const r of list){ if(r.id===mine?.id) continue; for(const d of (r.dishes||[])) if(norm(d.name)===n) return {who:r.name,name:d.name}; }
  return null;
}
// "Still needed": targets grow with headcount. Sides/apps ~1 per 6 people; bread/dessert ~1 per 10. (Drinks are BYOB.)
const PER={Appetizer:6,Side:6,Bread:10,Dessert:10};
const PLURAL={Appetizer:"appetizers",Side:"sides",Bread:"breads",Dessert:"desserts"};
function stillNeeded(){
  const people=list.reduce((n,r)=>n+headcount(r),0);
  const have={}; list.forEach(r=>(r.dishes||[]).forEach(d=>{ have[d.cat]=(have[d.cat]||0)+1; }));
  return Object.keys(PER).map(c=>[c, Math.max(1,Math.ceil(people/PER[c]))-(have[c]||0)]).filter(([,n])=>n>0);
}
function neededHTML(){
  const need=stillNeeded();
  if(!need.length) return `<div class="need">Every category is covered. Bring whatever you love.</div>`;
  return `<div class="need"><b>Still needed:</b> ${need.map(([c,n])=>n>1?`${n} more ${PLURAL[c]}`:c.toLowerCase()).join(", ")}</div>`;
}
function nameWarn(name){
  const r=nameTaken(name); if(!r) return "";
  return `Looks like ${esc(r.name)} already RSVP'd. If that's you, open your saved edit link to change it, or ask a host. A different ${esc(r.name)}? Add your last initial.`;
}
function dishWarn(name){
  const t=dishTaken(name); if(!t) return "";
  return `${esc(t.who)}'s already bringing ${esc(t.name.toLowerCase())}. Maybe something else? (Totally fine if you want to anyway.)`;
}
function icsHref(){
  const loc=(evt?.address||"Gladiola Studio").replace(/[,;\\]/g,m=>"\\"+m);
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Steaksgiving//RSVP//EN","BEGIN:VEVENT",
    "UID:steaksgiving-iv-2026@steaksgiving","DTSTAMP:20261107T000000Z",
    `DTSTART:${EVENT.start}`,`DTEND:${EVENT.end}`,`SUMMARY:${EVENT.title}`,`LOCATION:${loc}`,
    "DESCRIPTION:Look for the MEAT FLAG. "+location.origin+location.pathname,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  return "data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);
}
async function loadList(){
  const { data } = await sb.from("guest_list").select("*").order("created_at",{ascending:true}); list=data||[];
  if(H()){
    const { data: hx } = await sb.rpc("host_list",{p_token:mine.token});
    const by={}; (hx||[]).forEach(x=>by[x.id]=x);
    list=list.map(r=>({...r, arrived:by[r.id]?.arrived||false, host_note:by[r.id]?.host_note||null}));
    declined=(hx||[]).filter(x=>x.attending===false);
  } else declined=[];
}
async function loadBingo(){ const { data } = await sb.from("game").select("status,round").eq("id",1).maybeSingle(); bingo=data||null; }
async function refreshMine(){
  if(!mine?.token) return;
  const { data } = await sb.rpc("rsvp_get",{p_token:mine.token});
  if(!data){ mine=null; localStorage.removeItem("sg_rsvp"); } else { mine={...mine, ...data}; }
}
const headcount=r=>1+(r.guests||[]).length;

function hero(){
  return `<div class="hero"><h1>🥩 STEAKSGIVING IV</h1><div class="sub">The fourth annual steak potluck, celebrating friendship and togetherness</div>
    <div class="when">Friday, November 27 · 6–10 PM<br>Gladiola Studio</div></div>`;
}
function stats(){
  const people=list.reduce((n,r)=>n+headcount(r),0);
  const dishes=list.reduce((n,r)=>n+(r.dishes||[]).length,0);
  return `<div class="stats"><div class="stat"><b>${list.length}</b><span>RSVPs</span></div><div class="stat"><b>${people}</b><span>PEOPLE</span></div><div class="stat"><b>${dishes}</b><span>DISHES</span></div></div>`;
}
function catSummary(){
  const c={}; CATS.forEach(k=>c[k]=0);
  list.forEach(r=>(r.dishes||[]).forEach(d=>{ c[CATS.includes(d.cat)?d.cat:"Other"]++; }));
  return `<div class="catsum">${CATS.map(k=>`<div><b>${c[k]}</b>${k}</div>`).join("")}</div>`;
}
function guestList(){
  if(!list.length) return `<div class="card muted">Nobody has RSVP'd yet. Be first.</div>`;
  return `<div class="card">${list.map(r=>{
    const extras=(r.guests||[]).filter(g=>g&&g.trim());
    const plus=(r.guests||[]).length? ` <span class="plus">+${(r.guests||[]).length}${extras.length?` (${esc(extras.join(", "))})`:""}</span>`:"";
    const chips=(r.dishes||[]).length? `<div class="chips">${r.dishes.map(d=>`<span class="chip"><i>${esc((d.cat||"").toUpperCase())}</i>${esc(d.name)}</span>`).join("")}</div>`:`<div class="muted">Bringing: TBD</div>`;
    const host=H()?`<div class="acts"><button class="sec ${r.arrived?"arr":""}" data-arr="${r.id}" data-v="${r.arrived?0:1}">${r.arrived?"Here":"Arrived?"}</button><button class="sec" data-edit="${r.id}">Edit</button><button class="sec" data-mh="${r.id}" data-v="${r.is_host?0:1}" data-n="${esc(r.name)}">${r.is_host?"Unhost":"Make host"}</button><button class="sec" data-del="${r.id}" data-n="${esc(r.name)}">✕</button></div>`:"";
    const note=H()&&r.host_note?`<div class="hnote">Note: ${esc(r.host_note)}</div>`:"";
    return `<div class="guest ${r.arrived&&H()?"arrived":""}"><div class="hostrow"><span class="nm">${esc(r.name)}${r.is_host?'<span class="hbadge">HOST</span>':""}${plus}${mine&&mine.id===r.id?' <span class="plus">(you)</span>':""}</span>${host}</div>${chips}${note}</div>`;
  }).join("")}</div>`;
}

/* ---- host tools ---- */
function rosterText(){
  const people=list.reduce((n,r)=>n+headcount(r),0);
  const lines=[`STEAKSGIVING IV — ${list.length} RSVPs, ${people} people`,""];
  list.forEach(r=>{
    const g=(r.guests||[]); const names=g.filter(x=>x&&x.trim());
    lines.push(`${r.arrived?"[x] ":"[ ] "}${r.name}${g.length?` +${g.length}${names.length?` (${names.join(", ")})`:""}`:""}`);
    (r.dishes||[]).forEach(d=>lines.push(`      - ${d.name} (${d.cat})`));
    if(r.host_note) lines.push(`      note: ${r.host_note}`);
  });
  if(declined.length) lines.push("",`CAN'T MAKE IT (${declined.length}): ${declined.map(d=>d.name).join(", ")}`);
  lines.push("","BY CATEGORY");
  const c={}; CATS.forEach(k=>c[k]=[]);
  list.forEach(r=>(r.dishes||[]).forEach(d=>c[CATS.includes(d.cat)?d.cat:"Other"].push(`${d.name} (${r.name})`)));
  CATS.forEach(k=>lines.push(`${k}: ${c[k].length?c[k].join("; "):"—"}`));
  return lines.join("\n");
}
function hostBar(){
  const people=list.reduce((n,r)=>n+headcount(r),0);
  const here=list.filter(r=>r.arrived).reduce((n,r)=>n+headcount(r),0);
  const pct=Math.min(100,Math.round(people/TARGET*100));
  const noAns=Math.max(0,TARGET-people-declined.length);
  return `<div class="hostbar"><b>Host panel</b> · <b>${people}</b> coming · ${declined.length} can't · ${noAns} haven't answered (of ${TARGET})${here?` · ${here} here`:""}
    <div class="target"><i style="width:${pct}%"></i></div>
    <div class="row2"><button id="hadd">+ Add RSVP for someone</button><button id="hroster">${showRoster?"Hide":"Show"} roster</button><button id="hcopy">Copy roster</button></div>
    <div style="margin-top:12px"><b>Steak Bingo</b> · ${bingo?.status==="open"?"OPEN (Join buttons are showing)":bingo?.status==="ended"?"closed for the night":"not started"}</div>
    <div class="row3"><button id="hbingo" class="${bingo?.status==="open"?"":"go"}">${bingo?.status==="open"?"Close Bingo":"▶ Start Bingo"}</button><a href="bingo/?host">Bingo host screen</a><a href="bingo/?tv" target="_blank" rel="noopener">TV screen</a></div>
    ${showRoster?`<pre class="roster" style="margin:10px 0 0">${esc(rosterText())}</pre>`:""}</div>`;
}
function hostForm(){
  const d=hostEdit;
  return `<div class="card mine"><b>${d.id?"Edit RSVP":"New RSVP (host)"}</b>
    <label>Name</label><input id="hnm" maxlength="40" value="${esc(d.name)}">
    <label>Additional people</label>
    <div>${d.guests.map((g,i)=>`<div class="row"><input data-hg="${i}" maxlength="40" placeholder="Guest ${i+1}" value="${esc(g)}"><button class="x" data-hrg="${i}">×</button></div>`).join("")}</div>
    <button class="link" id="haddg">+ Add a person</button>
    <label>Dishes</label>
    <div>${d.dishes.map((x,i)=>`<div class="row"><input data-hd="${i}" maxlength="60" value="${esc(x.name)}"><select data-hc="${i}">${CATS.map(c=>`<option ${x.cat===c?"selected":""}>${c}</option>`).join("")}</select><button class="x" data-hrd="${i}">×</button></div>`).join("")}</div>
    <button class="link" id="haddd">+ Add a dish</button>
    <label>Host-only note</label><textarea id="hnote" placeholder="e.g., texted me, bringing a cooler">${esc(d.host_note||"")}</textarea>
    <div style="height:12px"></div><button class="btn" id="hsave">Save</button>
    <div style="text-align:center;margin-top:8px"><button class="link" id="hcancel">Cancel</button></div></div>`;
}
function syncHost(){
  hostEdit.name=document.getElementById("hnm")?.value??hostEdit.name;
  hostEdit.host_note=document.getElementById("hnote")?.value??hostEdit.host_note;
  app.querySelectorAll("[data-hg]").forEach(el=>hostEdit.guests[+el.dataset.hg]=el.value);
  app.querySelectorAll("[data-hd]").forEach(el=>hostEdit.dishes[+el.dataset.hd].name=el.value);
  app.querySelectorAll("[data-hc]").forEach(el=>hostEdit.dishes[+el.dataset.hc].cat=el.value);
}

function form(){
  const d=draft;
  return `<div class="card mine">
    <label>Your name</label><input id="nm" maxlength="40" placeholder="First name (last initial if there are two of you)" value="${esc(d.name)}" autocomplete="given-name">
    <div class="warn" id="nmwarn">${nameWarn(d.name)}</div>
    <label>Bringing anyone? <span class="muted" style="font-weight:400">(names optional)</span></label>
    <div id="guests">${d.guests.map((g,i)=>`<div class="row"><input data-g="${i}" maxlength="40" placeholder="Guest ${i+1}" value="${esc(g)}"><button class="x" data-rg="${i}" aria-label="Remove">×</button></div>`).join("")}</div>
    <button class="link" id="addg">+ Add a person</button>
    <label>What are you bringing? <span class="muted" style="font-weight:400">(add as many as you like)</span></label>
    ${neededHTML()}
    <div id="dishes">${d.dishes.map((x,i)=>`<div class="row"><input data-d="${i}" maxlength="60" placeholder="e.g., Green bean casserole" value="${esc(x.name)}"><select data-c="${i}">${CATS.map(c=>`<option ${x.cat===c?"selected":""}>${c}</option>`).join("")}</select><button class="x" data-rd="${i}" aria-label="Remove">×</button></div><div class="warn" data-dw="${i}">${dishWarn(x.name)}</div>`).join("")}</div>
    <button class="link" id="addd">+ Add a dish</button>
    <div style="height:12px"></div>
    <button class="btn" id="save">${mine&&mine.attending!==false?"Update my RSVP":"I'm in! Save RSVP"}</button>
    ${!mine?`<button class="btn sec" id="decline" style="margin-top:8px">Can't make it</button>`
      :mine.attending===false?`<div style="text-align:center;margin-top:8px"><button class="link" id="back">Back</button></div>`
      :`<div style="text-align:center;margin-top:8px"><button class="link" id="cancel">Can't make it after all</button> · <button class="link" id="back">Back</button></div>`}
  </div>`;
}
function syncDraft(){
  draft.name=document.getElementById("nm")?.value??draft.name;
  app.querySelectorAll("[data-g]").forEach(el=>draft.guests[+el.dataset.g]=el.value);
  app.querySelectorAll("[data-d]").forEach(el=>draft.dishes[+el.dataset.d].name=el.value);
  app.querySelectorAll("[data-c]").forEach(el=>draft.dishes[+el.dataset.c].cat=el.value);
}
function editLinkCard(){
  return `<div class="card"><b>Your edit link</b>
      <div class="muted" style="margin-top:4px">Save this to change your RSVP later from any phone or computer.</div>
      ${H()?`<div class="hwarn">🔑 You're a host: this link also unlocks host tools. Don't forward it.</div>`:""}
      <div class="btnrow"><button class="sec" id="copylink">Copy link</button>${navigator.share?`<button class="sec" id="sharelink">Share…</button>`:""}</div>
    </div>`;
}
function declinedCard(){
  return `<div class="ok" style="background:#6d4c41">😢 Sorry you'll miss it, ${esc(mine.name)}.</div>
    <div class="card mine"><b>Your RSVP: can't make it</b>
      <div class="muted" style="margin-top:4px">Thanks for letting us know. Plans changed? You can still come.</div>
      <div style="height:10px"></div><button class="btn" id="rejoin">I can come after all!</button></div>
    ${editLinkCard()}`;
}
function mineCard(){
  if(mine.attending===false) return declinedCard();
  const n=(mine.guests||[]).length;
  return `<div class="ok">✅ You're in${n?` with ${n} guest${n>1?"s":""}`:""}, ${esc(mine.name)}!</div>
    <div class="card mine"><b>Your RSVP</b>
      <div class="muted" style="margin-top:4px">${(mine.guests||[]).filter(g=>g&&g.trim()).length?`Guests: ${esc(mine.guests.filter(g=>g&&g.trim()).join(", "))}`:n?`+${n} guest${n>1?"s":""}`:"Just you"}</div>
      ${(mine.dishes||[]).length?`<div class="chips">${mine.dishes.map(d=>`<span class="chip"><i>${esc((d.cat||"").toUpperCase())}</i>${esc(d.name)}</span>`).join("")}</div>`:`<div class="muted">You haven't picked a dish yet.</div>`}
      <div style="height:10px"></div><button class="btn sec" id="edit">Edit my RSVP</button></div>
    <div class="card details"><b>The details</b>
      <div>📅 ${EVENT.when}</div>
      <div>🍺 <b>BYOB</b>: bring whatever you'd like to drink.</div>
      <div>📍 ${evt?.address?`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(evt.address)}" target="_blank" rel="noopener">${esc(evt.address)}</a>`:"Gladiola Studio"}</div>
      <div class="flag">🥩🚩 Look for the <b>MEAT FLAG</b>. If you see it, you've found the steak. If you don't, you're at a vegan's house — keep driving.</div>
      <a class="btn sec" style="display:block;text-align:center;text-decoration:none;margin-top:10px;box-sizing:border-box;border-radius:10px;padding:13px 16px;font-weight:700;color:var(--dark)" href="${icsHref()}" download="steaksgiving-iv.ics">📆 Add to calendar</a>
    </div>
    ${bingoCard()}
    ${editLinkCard()}`;
}
function declinedList(){
  if(!H()||!declined.length) return "";
  return `<h2>Can't make it (${declined.length})</h2><div class="card">${declined.map(d=>`<div class="guest"><span class="nm">${esc(d.name)}${d.is_host?'<span class="hbadge">HOST</span>':""}</span>
    <div class="muted">Said no ${new Date(d.updated_at).toLocaleDateString([], {month:"short",day:"numeric"})}${d.host_note?` · Note: ${esc(d.host_note)}`:""}</div></div>`).join("")}</div>`;
}

function bingoCard(){
  const st=bingo?.status;
  if(st==="open") return `<div class="card bingo"><div class="big">🥩 Steak Bingo is on!</div>
    <div class="muted" style="margin-bottom:10px">The host just started the game. Grab your board.</div>
    <a class="btn" style="display:block;text-align:center;text-decoration:none" href="bingo/?name=${encodeURIComponent(mine.name)}">Join Steak Bingo</a></div>`;
  if(st==="ended") return `<div class="card bingo"><div class="big">🥩 Thanks for playing Steak Bingo!</div><div class="muted">That's a wrap for tonight.</div></div>`;
  return `<div class="card bingo"><div class="big">🥩 Steak Bingo is on!</div>
    <div>We'll play five rounds of Steak Bingo at the party, so bring your phone. Each board pairs steak cuts with toppings, and you mark them off as the host calls them. When the game starts, a <b>Join Steak Bingo</b> button will appear right here.</div></div>`;
}
function render(){
  const showForm=!mine||editing;
  if(showForm && !editing && !draft.name && mine===null){ /* fresh */ }
  app.innerHTML=`${hero()}
    ${H()&&hostEdit?hostForm():`<h2>${showForm?(mine&&mine.attending!==false?"Edit your RSVP":"RSVP"):"You"}</h2>${showForm?form():mineCard()}`}
    ${H()?`<h2>Host tools</h2>${hostBar()}`:""}
    <h2>Who's coming</h2>
    ${stats()}
    ${catSummary()}
    <div style="height:6px"></div>
    ${guestList()}
    ${declinedList()}
    ${showForm?"":neededHTML()}`;
  wire();
}
function wire(){
  const $=id=>document.getElementById(id);
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm(`Remove ${b.dataset.n}'s RSVP?`)) return; const { error }=await sb.rpc("host_rsvp_delete",{p_token:mine.token,p_id:b.dataset.del}); if(error) toast(/function|schema cache/i.test(error.message)?"Removing RSVPs needs one more database step. Ask Claude.":error.message); else { await loadList(); render(); } });
  app.querySelectorAll("[data-arr]").forEach(b=>b.onclick=async()=>{ const { error }=await sb.rpc("host_rsvp_arrived",{p_token:mine.token,p_id:b.dataset.arr,p_arrived:b.dataset.v==="1"}); if(error) toast(error.message); else { await loadList(); render(); } });
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ const r=list.find(x=>x.id===b.dataset.edit); if(!r) return; hostEdit={id:r.id,name:r.name,guests:[...(r.guests||[])],dishes:(r.dishes||[]).map(d=>({...d})),host_note:r.host_note||""}; render(); window.scrollTo({top:0,behavior:"smooth"}); });
  app.querySelectorAll("[data-mh]").forEach(b=>b.onclick=async()=>{
    const make=b.dataset.v==="1", self=b.dataset.mh===mine.id;
    if(!make && !confirm(self?"Remove your own host status? You'll lose host tools.":`Remove host status from ${b.dataset.n}?`)) return;
    const { error }=await sb.rpc("host_set_host",{p_token:mine.token,p_id:b.dataset.mh,p_is_host:make});
    if(error) return toast(error.message);
    if(self){ await refreshMine(); }
    await loadList(); render(); toast(make?`${b.dataset.n} is now a host`:`${b.dataset.n} is no longer a host`);
  });
  if($("hbingo")) $("hbingo").onclick=async()=>{
    const open=bingo?.status==="open";
    if(open && !confirm("Close Steak Bingo for the night? Join buttons disappear and boards close.")) return;
    const { error }=await sb.rpc("host_bingo_status",{p_token:mine.token,p_status:open?"ended":"open"});
    if(error) return toast(error.message);
    await loadBingo(); render(); toast(open?"Bingo closed":"Steak Bingo is open!");
  };
  if($("hadd")) $("hadd").onclick=()=>{ hostEdit={id:null,name:"",guests:[],dishes:[],host_note:""}; render(); };
  if($("hroster")) $("hroster").onclick=()=>{ showRoster=!showRoster; render(); };
  if($("hcopy")) $("hcopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(rosterText()); toast("Roster copied"); }catch{ showRoster=true; render(); toast("Long-press the roster to copy"); } };
  if($("haddg")) $("haddg").onclick=()=>{ syncHost(); hostEdit.guests.push(""); render(); };
  if($("haddd")) $("haddd").onclick=()=>{ syncHost(); hostEdit.dishes.push({name:"",cat:"Side"}); render(); };
  app.querySelectorAll("[data-hrg]").forEach(b=>b.onclick=()=>{ syncHost(); hostEdit.guests.splice(+b.dataset.hrg,1); render(); });
  app.querySelectorAll("[data-hrd]").forEach(b=>b.onclick=()=>{ syncHost(); hostEdit.dishes.splice(+b.dataset.hrd,1); render(); });
  if($("hcancel")) $("hcancel").onclick=()=>{ hostEdit=null; render(); };
  if($("hsave")) $("hsave").onclick=async()=>{
    syncHost(); const name=hostEdit.name.trim(); if(!name) return toast("Need a name");
    const { error }=await sb.rpc("host_rsvp_save",{p_token:mine.token,p_id:hostEdit.id,p_name:name,p_guests:hostEdit.guests.map(g=>g.trim()),p_dishes:hostEdit.dishes.map(d=>({name:d.name.trim(),cat:d.cat})).filter(d=>d.name),p_host_note:hostEdit.host_note});
    if(error) return toast(error.message);
    hostEdit=null; await loadList(); render(); toast("Saved");
  };
  if($("nm")) $("nm").oninput=e=>{ $("nmwarn").innerHTML=nameWarn(e.target.value); };
  app.querySelectorAll("[data-d]").forEach(el=>el.oninput=()=>{ const w=app.querySelector(`[data-dw="${el.dataset.d}"]`); if(w) w.innerHTML=dishWarn(el.value); });
  if($("copylink")) $("copylink").onclick=async()=>{ try{ await navigator.clipboard.writeText(editLink()); toast("Link copied. Text it to yourself!"); }catch{ prompt("Copy your edit link:",editLink()); } };
  if($("sharelink")) $("sharelink").onclick=async()=>{ try{ await navigator.share({title:"My Steaksgiving RSVP",text:"Edit my Steaksgiving IV RSVP:",url:editLink()}); }catch{} };
  if($("edit")) $("edit").onclick=()=>{ draft={name:mine.name,guests:[...(mine.guests||[])],dishes:(mine.dishes||[]).map(d=>({...d}))}; editing=true; render(); };
  if($("back")) $("back").onclick=()=>{ editing=false; render(); };
  if($("addg")) $("addg").onclick=()=>{ syncDraft(); if(draft.guests.length>=10) return toast("That's a lot of guests"); draft.guests.push(""); render(); setTimeout(()=>app.querySelector(`[data-g="${draft.guests.length-1}"]`)?.focus(),0); };
  if($("addd")) $("addd").onclick=()=>{ syncDraft(); if(draft.dishes.length>=10) return toast("Save some for everyone else"); draft.dishes.push({name:"",cat:"Side"}); render(); setTimeout(()=>app.querySelector(`[data-d="${draft.dishes.length-1}"]`)?.focus(),0); };
  app.querySelectorAll("[data-rg]").forEach(b=>b.onclick=()=>{ syncDraft(); draft.guests.splice(+b.dataset.rg,1); render(); });
  app.querySelectorAll("[data-rd]").forEach(b=>b.onclick=()=>{ syncDraft(); draft.dishes.splice(+b.dataset.rd,1); render(); });
  if($("cancel")) $("cancel").onclick=async()=>{
    if(!confirm("Mark yourself as can't make it? You can change your mind later.")) return;
    const { error:ce }=await sb.rpc("rsvp_decline",{p_token:mine.token}); if(ce) return toast(ce.message);
    editing=false; await refreshMine(); await Promise.all([loadList(), loadEvent()]); render(); toast("Got it. We'll miss you!");
    window.scrollTo({top:0,behavior:"smooth"});
  };
  if($("rejoin")) $("rejoin").onclick=()=>{ draft={name:mine.name,guests:[],dishes:[]}; editing=true; render(); };
  if($("decline")) $("decline").onclick=async()=>{
    syncDraft();
    const name=draft.name.trim(); if(!name){ toast("Add your name first"); return $("nm").focus(); }
    $("decline").disabled=true;
    const { data, error }=await sb.rpc("rsvp_save",{p_token:null,p_name:name,p_guests:[],p_dishes:[],p_attending:false});
    if(error){ toast("Couldn't save, try again"); $("decline").disabled=false; return; }
    mine={id:data.id,token:data.token,name}; localStorage.setItem("sg_rsvp",JSON.stringify({id:data.id,token:data.token}));
    editing=false; await refreshMine(); await Promise.all([loadList(), loadEvent()]); render(); toast("Thanks for letting us know!");
    window.scrollTo({top:0,behavior:"smooth"});
  };
  if($("save")) $("save").onclick=async()=>{
    syncDraft();
    const name=draft.name.trim(); if(!name) return toast("Need your name");
    const guests=draft.guests.map(g=>g.trim());
    const dishes=draft.dishes.map(d=>({name:d.name.trim(),cat:d.cat})).filter(d=>d.name);
    $("save").disabled=true;
    const { data, error }=await sb.rpc("rsvp_save",{p_token:mine?.token??null,p_name:name,p_guests:guests,p_dishes:dishes,p_attending:true});
    if(error){ toast("Couldn't save, try again"); $("save").disabled=false; return; }
    const isNew=!mine||mine.attending===false;
    mine={...(mine||{}),id:data.id,token:data.token,name,guests,dishes}; localStorage.setItem("sg_rsvp",JSON.stringify({id:data.id,token:data.token}));
    editing=false; await refreshMine(); await Promise.all([loadList(), loadEvent()]); render(); toast(isNew?"You're in!":"Saved!");
    window.scrollTo({top:0,behavior:"smooth"});
  };
}

(async()=>{
  loadMine();
  await Promise.all([refreshMine(), loadBingo()]);
  await loadList();
  if(mine && !mine.name){ mine=null; localStorage.removeItem("sg_rsvp"); }
  await loadEvent();
  render();
  if(editTok && mine?.token!==editTok) toast("That edit link didn't work. Ask a host for help.");
  // Fallback if the live connection drops: re-check Bingo status every 20s.
  setInterval(async()=>{ const before=bingo?.status; await loadBingo(); if(bingo?.status!==before && !editing && !hostEdit && mine) render(); },20000);
  sb.channel("rsvp-live")
  .on("postgres_changes",{event:"UPDATE",schema:"public",table:"game"},p=>{
    const before=bingo?.status; bingo={status:p.new.status,round:p.new.round};
    if(before!==bingo.status && !editing && !hostEdit && mine) render();
  })
  .on("postgres_changes",{event:"*",schema:"public",table:"rsvp_ping"},async()=>{
    if(mine?.token) await refreshMine();
    await loadList();
    if(hostEdit) return;
    if(!mine||editing){
      // Form is open: keep what they've typed and where the cursor is.
      syncDraft();
      const a=document.activeElement, key=a&&(a.id?"#"+a.id:a.dataset?.d!=null?`[data-d="${a.dataset.d}"]`:a.dataset?.g!=null?`[data-g="${a.dataset.g}"]`:null);
      const pos=key&&a.selectionStart;
      render();
      if(key){ const el=app.querySelector(key); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch{} } }
    } else render();
  }).subscribe();
})();
</script>
</body>
</html>
