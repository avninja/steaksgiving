<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steaksgiving IV · RSVP</title>
<meta property="og:title" content="Steaksgiving IV">
<meta property="og:description" content="Friday, Nov 27 at Gladiola Studio. RSVP and tell us what you're bringing.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
<style>
  :root{--red:#8b1e1e;--cream:#fbf5ec;--tan:#e8d9c4;--dark:#2b1a14;--ok:#2e7d32;--muted:#8a7a6c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--cream);color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .wrap{max-width:560px;margin:0 auto;padding:16px 12px 40px}
  .hero{background:var(--red);color:#fff;border-radius:16px;padding:22px 18px;text-align:center}
  .hero h1{margin:0;font-size:30px;letter-spacing:1px;line-height:1.05}
  .hero .sub{opacity:.9;margin-top:6px;font-size:15px}
  .hero .when{margin-top:12px;font-size:17px;font-weight:700}
  h2{font-size:17px;margin:18px 0 8px}
  .card{background:#fff;border:1px solid var(--tan);border-radius:12px;padding:14px;margin:10px 0}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
  input,select{font:inherit;width:100%;padding:12px;border:2px solid var(--tan);border-radius:10px;font-size:17px;background:#fff;min-width:0}
  button{font:inherit;border:0;border-radius:10px;padding:13px 16px;font-weight:700;cursor:pointer}
  .btn{background:var(--red);color:#fff;width:100%;font-size:18px}
  .btn:disabled{background:#c9b8a6}
  .sec{background:var(--tan);color:var(--dark)}
  .link{background:none;color:var(--red);text-decoration:underline;padding:6px 0;font-size:14px}
  .row{display:flex;gap:8px;align-items:center;margin-top:6px}
  .row input{flex:1}
  .row select{flex:0 0 118px}
  .x{flex:0 0 42px;height:46px;background:var(--tan);color:var(--dark);font-size:20px;line-height:1;padding:0}
  .muted{color:var(--muted);font-size:13px}
  .stats{display:flex;gap:8px;margin:12px 0}
  .stat{flex:1;background:#fff;border:1px solid var(--tan);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:26px;color:var(--red)}
  .stat span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px}
  .guest{padding:10px 0;border-bottom:1px solid var(--tan)}
  .guest:last-child{border-bottom:0}
  .guest .nm{font-weight:800;font-size:16px}
  .guest .plus{color:var(--muted);font-weight:600;font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{background:var(--cream);border:1px solid var(--tan);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
  .chip i{font-style:normal;color:var(--muted);font-weight:700;margin-right:4px;font-size:11px;letter-spacing:.5px}
  .mine{border-color:var(--red);border-width:2px}
  .ok{background:var(--ok);color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;text-align:center;margin:10px 0}
  .toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  .catsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .catsum div{background:#fff;border:1px solid var(--tan);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--muted);font-weight:700}
  .catsum div b{display:block;font-size:20px;color:var(--dark)}
  .hostrow{display:flex;justify-content:space-between;align-items:center}
  .hostrow button{padding:6px 10px;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="muted" style="text-align:center;padding:40px 0">Loading…</div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://ntmbifttgdguxifgbrcc.supabase.co", "sb_publishable_8gHqh_eoL7Io2-3QvJ2kcA_2VB-C_7W");
const CATS=["Appetizer","Side","Bread","Dessert","Drinks","Other"];
const app=document.getElementById("app"), toastEl=document.getElementById("toast");
const isHost=new URLSearchParams(location.search).has("host");
let pin=sessionStorage.getItem("sg_pin")||"";
const toast=m=>{ toastEl.textContent=m; toastEl.classList.add("show"); setTimeout(()=>toastEl.classList.remove("show"),2400); };
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let list=[], mine=null, editing=false;
// draft kept in memory while the form is open
let draft={name:"",guests:[],dishes:[]};

function loadMine(){ try{ mine=JSON.parse(localStorage.getItem("sg_rsvp")||"null"); }catch{ mine=null; } }
async function loadList(){ const { data } = await sb.from("rsvps_public").select("*").order("created_at",{ascending:true}); list=data||[]; }
async function refreshMine(){
  if(!mine?.token) return;
  const { data } = await sb.rpc("rsvp_get",{p_token:mine.token});
  if(!data){ mine=null; localStorage.removeItem("sg_rsvp"); } else { mine={...mine, ...data}; }
}
const headcount=r=>1+(r.guests||[]).length;

function hero(){
  return `<div class="hero"><h1>🥩 STEAKSGIVING IV</h1><div class="sub">The fourth annual steak potluck, celebrating friendship and togetherness</div>
    <div class="when">Friday, November 27 · Gladiola Studio</div></div>`;
}
function stats(){
  const people=list.reduce((n,r)=>n+headcount(r),0);
  const dishes=list.reduce((n,r)=>n+(r.dishes||[]).length,0);
  return `<div class="stats"><div class="stat"><b>${list.length}</b><span>RSVPs</span></div><div class="stat"><b>${people}</b><span>PEOPLE</span></div><div class="stat"><b>${dishes}</b><span>DISHES</span></div></div>`;
}
function catSummary(){
  const c={}; CATS.forEach(k=>c[k]=0);
  list.forEach(r=>(r.dishes||[]).forEach(d=>{ c[CATS.includes(d.cat)?d.cat:"Other"]++; }));
  return `<div class="catsum">${CATS.map(k=>`<div><b>${c[k]}</b>${k}</div>`).join("")}</div>`;
}
function guestList(){
  if(!list.length) return `<div class="card muted">Nobody has RSVP'd yet. Be first.</div>`;
  return `<div class="card">${list.map(r=>{
    const extras=(r.guests||[]).filter(g=>g&&g.trim());
    const plus=(r.guests||[]).length? ` <span class="plus">+${(r.guests||[]).length}${extras.length?` (${esc(extras.join(", "))})`:""}</span>`:"";
    const chips=(r.dishes||[]).length? `<div class="chips">${r.dishes.map(d=>`<span class="chip"><i>${esc((d.cat||"").toUpperCase())}</i>${esc(d.name)}</span>`).join("")}</div>`:`<div class="muted">Bringing: TBD</div>`;
    const host=isHost&&pin?`<button class="sec" data-del="${r.id}" data-n="${esc(r.name)}">Remove</button>`:"";
    return `<div class="guest ${mine&&mine.id===r.id?"":""}"><div class="hostrow"><span class="nm">${esc(r.name)}${plus}${mine&&mine.id===r.id?' <span class="plus">(you)</span>':""}</span>${host}</div>${chips}</div>`;
  }).join("")}</div>`;
}

function form(){
  const d=draft;
  return `<div class="card mine">
    <label>Your name</label><input id="nm" maxlength="40" placeholder="First name (last initial if there are two of you)" value="${esc(d.name)}" autocomplete="given-name">
    <label>Bringing anyone? <span class="muted" style="font-weight:400">(names optional)</span></label>
    <div id="guests">${d.guests.map((g,i)=>`<div class="row"><input data-g="${i}" maxlength="40" placeholder="Guest ${i+1}" value="${esc(g)}"><button class="x" data-rg="${i}" aria-label="Remove">×</button></div>`).join("")}</div>
    <button class="link" id="addg">+ Add a person</button>
    <label>What are you bringing? <span class="muted" style="font-weight:400">(add as many as you like)</span></label>
    <div id="dishes">${d.dishes.map((x,i)=>`<div class="row"><input data-d="${i}" maxlength="60" placeholder="e.g., Mac and cheese" value="${esc(x.name)}"><select data-c="${i}">${CATS.map(c=>`<option ${x.cat===c?"selected":""}>${c}</option>`).join("")}</select><button class="x" data-rd="${i}" aria-label="Remove">×</button></div>`).join("")}</div>
    <button class="link" id="addd">+ Add a dish</button>
    <div style="height:12px"></div>
    <button class="btn" id="save">${mine?"Update my RSVP":"I'm in! Save RSVP"}</button>
    ${mine?`<div style="text-align:center;margin-top:8px"><button class="link" id="cancel">Can't make it after all</button> · <button class="link" id="back">Back</button></div>`:""}
  </div>`;
}
function syncDraft(){
  draft.name=document.getElementById("nm")?.value??draft.name;
  app.querySelectorAll("[data-g]").forEach(el=>draft.guests[+el.dataset.g]=el.value);
  app.querySelectorAll("[data-d]").forEach(el=>draft.dishes[+el.dataset.d].name=el.value);
  app.querySelectorAll("[data-c]").forEach(el=>draft.dishes[+el.dataset.c].cat=el.value);
}
function mineCard(){
  const n=(mine.guests||[]).length;
  return `<div class="ok">✅ You're in${n?` with ${n} guest${n>1?"s":""}`:""}, ${esc(mine.name)}!</div>
    <div class="card mine"><b>Your RSVP</b>
      <div class="muted" style="margin-top:4px">${(mine.guests||[]).filter(g=>g&&g.trim()).length?`Guests: ${esc(mine.guests.filter(g=>g&&g.trim()).join(", "))}`:n?`+${n} guest${n>1?"s":""}`:"Just you"}</div>
      ${(mine.dishes||[]).length?`<div class="chips">${mine.dishes.map(d=>`<span class="chip"><i>${esc((d.cat||"").toUpperCase())}</i>${esc(d.name)}</span>`).join("")}</div>`:`<div class="muted">You haven't picked a dish yet.</div>`}
      <div style="height:10px"></div><button class="btn sec" id="edit">Edit my RSVP</button></div>`;
}

function render(){
  const showForm=!mine||editing;
  if(showForm && !editing && !draft.name && mine===null){ /* fresh */ }
  app.innerHTML=`${hero()}
    ${isHost&&!pin?`<div class="card"><label>Host PIN</label><input id="pin" inputmode="numeric" maxlength="4"><div style="height:8px"></div><button class="btn" id="pingo">Unlock host tools</button></div>`:""}
    <h2>${showForm?(mine?"Edit your RSVP":"RSVP"):"You"}</h2>
    ${showForm?form():mineCard()}
    <h2>Who's coming</h2>
    ${stats()}
    ${catSummary()}
    <div style="height:6px"></div>
    ${guestList()}
    <p class="muted" style="text-align:center">Kirk's got the steak, mac and cheese, and dessert covered. Appetizers, veggie sides, bread, and drinks are the gaps to fill.</p>`;
  wire();
}
function wire(){
  const $=id=>document.getElementById(id);
  if($("pingo")) $("pingo").onclick=async()=>{ const p=$("pin").value.trim(); const { data }=await sb.rpc("check_pin",{p_pin:p}); if(!data) return toast("Wrong PIN"); pin=p; sessionStorage.setItem("sg_pin",p); render(); };
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm(`Remove ${b.dataset.n}'s RSVP?`)) return; const { error }=await sb.rpc("host_rsvp_delete",{p_pin:pin,p_id:b.dataset.del}); if(error) toast(error.message); else { await loadList(); render(); } });
  if($("edit")) $("edit").onclick=()=>{ draft={name:mine.name,guests:[...(mine.guests||[])],dishes:(mine.dishes||[]).map(d=>({...d}))}; editing=true; render(); };
  if($("back")) $("back").onclick=()=>{ editing=false; render(); };
  if($("addg")) $("addg").onclick=()=>{ syncDraft(); if(draft.guests.length>=10) return toast("That's a lot of guests"); draft.guests.push(""); render(); setTimeout(()=>app.querySelector(`[data-g="${draft.guests.length-1}"]`)?.focus(),0); };
  if($("addd")) $("addd").onclick=()=>{ syncDraft(); if(draft.dishes.length>=10) return toast("Save some for everyone else"); draft.dishes.push({name:"",cat:"Side"}); render(); setTimeout(()=>app.querySelector(`[data-d="${draft.dishes.length-1}"]`)?.focus(),0); };
  app.querySelectorAll("[data-rg]").forEach(b=>b.onclick=()=>{ syncDraft(); draft.guests.splice(+b.dataset.rg,1); render(); });
  app.querySelectorAll("[data-rd]").forEach(b=>b.onclick=()=>{ syncDraft(); draft.dishes.splice(+b.dataset.rd,1); render(); });
  if($("cancel")) $("cancel").onclick=async()=>{ if(!confirm("Cancel your RSVP?")) return; await sb.rpc("rsvp_cancel",{p_token:mine.token}); mine=null; editing=false; draft={name:"",guests:[],dishes:[]}; localStorage.removeItem("sg_rsvp"); await loadList(); render(); toast("RSVP cancelled. We'll miss you."); };
  if($("save")) $("save").onclick=async()=>{
    syncDraft();
    const name=draft.name.trim(); if(!name) return toast("Need your name");
    const guests=draft.guests.map(g=>g.trim());
    const dishes=draft.dishes.map(d=>({name:d.name.trim(),cat:d.cat})).filter(d=>d.name);
    $("save").disabled=true;
    const { data, error }=await sb.rpc("rsvp_save",{p_token:mine?.token??null,p_name:name,p_guests:guests,p_dishes:dishes});
    if(error){ toast("Couldn't save, try again"); $("save").disabled=false; return; }
    mine={id:data.id,token:data.token,name,guests,dishes}; localStorage.setItem("sg_rsvp",JSON.stringify({id:data.id,token:data.token}));
    editing=false; await loadList(); render(); toast(mine?"Saved!":"You're in!");
    window.scrollTo({top:0,behavior:"smooth"});
  };
}

(async()=>{
  loadMine();
  await Promise.all([loadList(), refreshMine()]);
  if(mine && !mine.name){ mine=null; localStorage.removeItem("sg_rsvp"); }
  render();
  sb.channel("rsvp-live").on("postgres_changes",{event:"*",schema:"public",table:"rsvps"},async()=>{ await loadList(); if(!editing) render(); }).subscribe();
})();
</script>
</body>
</html>
