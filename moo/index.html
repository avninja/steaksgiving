<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steaksgiving IV · Moo Cowpetition</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>">
<style>
  :root{--red:#8b1e1e;--cream:#fbf5ec;--tan:#e8d9c4;--dark:#2b1a14;--ok:#2e7d32;--muted:#8a7a6c;--gold:#e0b84a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#5e0d12;color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  body:not(.tv){min-height:100vh;background:linear-gradient(rgba(40,6,8,.28),rgba(40,6,8,.28)),url(../img/marbling.jpg) 0 0/640px repeat #5e0d12}
  .wrap{max-width:560px;margin:0 auto;padding:16px 12px 40px}
  .hero{background:var(--red);color:#fff;border-radius:16px;padding:20px 12px;text-align:center;border:3px solid var(--cream);box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .hero h1{margin:0;font-size:27px;letter-spacing:1px;line-height:1.05}
  .hero .sub{opacity:.9;margin-top:6px;font-size:15px}
  h2{font-size:17px;margin:18px 0 8px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .card{box-shadow:0 4px 14px rgba(0,0,0,.25);background:#fff;border:1px solid var(--tan);border-radius:12px;padding:14px;margin:10px 0}
  .card.now{border:2px solid var(--red)}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
  input{font:inherit;width:100%;padding:12px;border:2px solid var(--tan);border-radius:10px;font-size:17px;background:#fff;min-width:0}
  button{font:inherit;border:0;border-radius:10px;padding:13px 16px;font-weight:700;cursor:pointer}
  .btn{background:var(--red);color:#fff;width:100%;font-size:18px;margin-top:14px}
  .btn:disabled{background:#c9b8a6}
  .sec{background:var(--tan);color:var(--dark)}
  .muted{color:var(--muted);font-size:13px}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--red)}
  .who{font-size:28px;font-weight:800;line-height:1.1;margin:2px 0 4px;overflow-wrap:anywhere}
  .cat{margin-top:14px}
  .cat .t{font-weight:800;font-size:16px}
  .cat .h{font-size:13px;color:var(--muted);margin-bottom:6px}
  .scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .scale button{background:var(--cream);border:2px solid var(--tan);color:var(--dark);font-size:20px;padding:12px 0}
  .scale button.on{background:var(--red);border-color:var(--red);color:#fff}
  .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--tan)}
  .li:last-child{border-bottom:0}
  .li .nm{font-weight:800;font-size:16px;overflow-wrap:anywhere;min-width:0}
  .li .r{font-size:13px;color:var(--muted);font-weight:700;text-align:right;flex:0 0 auto}
  .badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:2px;background:var(--tan);color:var(--dark)}
  .badge.open{background:var(--ok);color:#fff}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .acts button{padding:8px 11px;font-size:13px}
  .go{background:var(--ok);color:#fff}
  .row{display:flex;gap:8px}
  .row input{flex:1}
  .row button{flex:0 0 auto;background:var(--red);color:#fff}
  .hostbar{background:var(--dark);color:#fff;border-radius:12px;padding:12px 14px;margin:10px 0}
  .hostbar .row3{display:flex;gap:8px;margin-top:10px}
  .hostbar .row3 a,.hostbar .row3 button{flex:1;background:rgba(255,255,255,.14);color:#fff;font-size:14px;padding:10px;border-radius:10px;text-align:center;text-decoration:none;font-weight:700}
  .hostbar .row3 .go{background:var(--ok)}
  .win{background:#fff3cd;border:2px solid var(--gold);color:#5c4400;border-radius:12px;padding:14px;margin:10px 0;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .win .big{font-size:24px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:11px;letter-spacing:.5px;color:var(--muted);text-align:right;padding:4px 4px;font-weight:800}
  th:first-child,td:first-child{text-align:left}
  td{padding:9px 4px;border-top:1px solid var(--tan);text-align:right;font-variant-numeric:tabular-nums}
  td.n{font-weight:800;overflow-wrap:anywhere}
  td.tot{font-weight:800;color:var(--red);font-size:16px}
  .toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:92vw;text-align:center}
  .toast.show{opacity:1}
  a.back{color:#fff;font-size:14px;font-weight:700;display:inline-block;margin-top:14px}
  /* TV screen */
  body.tv{background:#5e0d12;color:#fff;min-height:100vh}
  body.tv .wrap{max-width:none;padding:3vh 4vw;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .tv-title{font-size:4.5vw;font-weight:800;letter-spacing:.3vw}
  .tv-eyebrow{font-size:3vw;font-weight:800;letter-spacing:.6vw;color:var(--gold);margin-top:3vh}
  .tv-name{font-size:11vw;font-weight:800;line-height:1;margin:2vh 0;overflow-wrap:anywhere}
  .tv-sub{font-size:2.6vw;opacity:.9;margin-top:1.5vh}
  .tv-url{font-size:2.4vw;margin-top:4vh;background:rgba(0,0,0,.28);border-radius:1.2vw;padding:1.4vh 2.4vw}
  .tv-url b{color:var(--gold)}
  .tv-board{width:86vw;margin-top:2vh;font-size:2.7vw}
  .tv-board th{color:var(--gold);font-size:1.5vw;padding:.6vh 1vw}
  .tv-board td{border-top:1px solid rgba(255,255,255,.25);padding:1.1vh 1vw}
  .tv-board td.tot{color:var(--gold);font-size:3.2vw}
  .tv-board tr.first td{font-size:3.6vw}
  .tv-win{font-size:5.4vw;font-weight:800;color:var(--gold);line-height:1.1;margin-top:1vh;overflow-wrap:anywhere}
  #sound{position:fixed;right:2vw;bottom:2vh;background:var(--gold);color:#3a2a00;font-size:1.6vw;padding:1vh 1.4vw;z-index:5}
</style>
</head>
<body>
<div class="wrap" id="app"><div style="text-align:center;padding:40px 0;color:#fff">Loading…</div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://ntmbifttgdguxifgbrcc.supabase.co", "sb_publishable_8gHqh_eoL7Io2-3QvJ2kcA_2VB-C_7W");
const Q=new URLSearchParams(location.search), isHost=Q.has("host"), isTV=Q.has("tv");
if(isTV) document.body.classList.add("tv");
const $=id=>document.getElementById(id), app=$("app"), toastEl=$("toast");
const toast=m=>{ toastEl.textContent=m; toastEl.classList.add("show"); setTimeout(()=>toastEl.classList.remove("show"),2600); };
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={ get:k=>{ try{ return localStorage.getItem(k); }catch{ return null; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch{} } };
const CATS=[
  {k:"realism", t:"Realism",     h:"Would a real cow be fooled?"},
  {k:"passion", t:"Passion",     h:"Did they moo from the heart?"},
  {k:"herd",    t:"Herd Appeal", h:"Would the herd follow them anywhere?"},
];
const fmt=n=>n==null?"–":Number(n).toFixed(1);

// who is voting: one ballot per phone, per contestant
function uuid(){ return crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)); }
let voter=ls.get("sg_moo_voter"); if(!/^[0-9a-f-]{36}$/i.test(voter||"")){ voter=uuid(); ls.set("sg_moo_voter",voter); }
let myName=(Q.get("name")||ls.get("sg_name")||"").slice(0,40);
let hostTok=null; try{ hostTok=JSON.parse(ls.get("sg_rsvp")||"null")?.token||null; }catch{}
let hostOK=false;

let cows=[], revealed=false, counts={}, mine={}, board=null, picks={}, busy=false, typing=false;

async function load(){
  const [c,s,n,m]=await Promise.all([
    sb.from("moo_contestants").select("id,name,status,created_at").neq("status","removed").order("created_at",{ascending:true}),
    sb.from("moo_state").select("revealed").eq("id",1).maybeSingle(),
    sb.rpc("moo_counts"),
    isTV||isHost ? Promise.resolve({data:null}) : sb.rpc("moo_my_votes",{p_voter:voter}),
  ]);
  if(c.error||s.error) return false;            // offline: keep what is on screen
  cows=c.data||[]; revealed=!!s.data?.revealed; counts=n.data||{};
  if(m.data){ mine={}; m.data.forEach(v=>mine[v.contestant_id]=v); }
  if(revealed || (isHost&&hostOK)){ const { data }=await sb.rpc("moo_board",{p_token:isHost&&hostOK?hostTok:null}); board=data||null; } else board=null;
  return true;
}
const openCow=()=>cows.find(c=>c.status==="open");

// ---------- voter ----------
function voterScreen(){
  const o=openCow();
  let h=`<div class="hero"><h1>🐄 THE MOO COWPETITION</h1><div class="sub">Rate every moo. The best cow takes home the Golden Calf Award.</div></div>`;
  if(revealed) h+=results();
  h+=`<div class="card"><label for="nm" style="margin-top:0">Your name</label><input id="nm" maxlength="40" autocomplete="name" placeholder="So nobody rates their own moo" value="${esc(myName)}"></div>`;
  if(o){
    const p=picks[o.id]||(picks[o.id]=mine[o.id]?{realism:mine[o.id].realism,passion:mine[o.id].passion,herd:mine[o.id].herd}:{});
    const isMe=myName.trim().toLowerCase()===o.name.trim().toLowerCase();
    h+=`<div class="card now"><div class="eyebrow">NOW MOOING</div><div class="who">${esc(o.name)}</div>`;
    if(isMe) h+=`<div class="muted" style="font-size:15px">That's you! No rating your own moo. Go give it everything.</div>`;
    else{
      h+=CATS.map(c=>`<div class="cat"><div class="t">${c.t}</div><div class="h">${c.h}</div><div class="scale">${[1,2,3,4,5].map(n=>`<button data-c="${c.k}" data-n="${n}" class="${p[c.k]===n?"on":""}" aria-pressed="${p[c.k]===n}" aria-label="${c.t} ${n} of 5">${n}</button>`).join("")}</div></div>`).join("");
      const done=CATS.every(c=>p[c.k]);
      const same=mine[o.id] && CATS.every(c=>mine[o.id][c.k]===p[c.k]);
      h+=`<button class="btn" id="send" ${!done||same||busy?"disabled":""}>${same?"✓ Rating saved":mine[o.id]?"Update my rating":"Submit rating"}</button>
        <div class="muted" style="margin-top:8px;text-align:center">${mine[o.id]?"You can change it until the host closes voting.":"1 is a sad kazoo. 5 is a prize heifer."}</div>`;
    }
    h+=`</div>`;
  } else if(!revealed){
    h+=`<div class="card" style="text-align:center"><div class="who" style="font-size:22px">${cows.length?"Waiting for the next cow…":"The cowpetition hasn't started yet"}</div><div class="muted">Keep this page open. The rating buttons appear when the host calls the next contestant.</div></div>`;
  }
  const past=cows.filter(c=>c.status!=="open");
  if(past.length) h+=`<h2>The herd so far</h2><div class="card">${past.map(c=>{ const v=mine[c.id];
      return `<div class="li"><div class="nm">${esc(c.name)}</div><div class="r">${c.status==="waiting"?"up soon":v?`You gave ${v.realism} · ${v.passion} · ${v.herd}`:"voting closed"}</div></div>`; }).join("")}</div>`;
  h+=`<div style="text-align:center"><a class="back" href="../">← Back to the RSVP page</a></div>`;
  app.innerHTML=h;
  const nm=$("nm");
  nm.onfocus=()=>typing=true;
  nm.oninput=()=>{ myName=nm.value.slice(0,40); ls.set("sg_name",myName.trim()); };
  nm.onblur=()=>{ typing=false; render(); };
  app.querySelectorAll(".scale button").forEach(b=>b.onclick=()=>{ picks[o.id][b.dataset.c]=+b.dataset.n; render(); });
  if($("send")) $("send").onclick=async()=>{
    if(!myName.trim()){ toast("Add your name first."); $("nm").focus(); return; }
    const p=picks[o.id]; busy=true; render();
    const { error }=await sb.rpc("moo_vote",{p_contestant:o.id,p_voter:voter,p_name:myName.trim(),p_realism:p.realism,p_passion:p.passion,p_herd:p.herd});
    busy=false;
    if(error){ toast(/closed/i.test(error.message)?"Voting just closed for this moo.":/own moo/i.test(error.message)?"No rating your own moo!":"Couldn't save that. Check your connection and try again."); await load(); }
    else{ mine[o.id]={contestant_id:o.id,...p}; toast("Rating saved. Moo!"); }
    render();
  };
}

function results(tv){
  const rows=(board||[]).filter(r=>r.votes>0);
  if(!rows.length) return tv?`<div class="tv-sub">No ratings yet.</div>`:`<div class="card">No ratings yet.</div>`;
  const top=rows.filter(r=>Number(r.total)===Number(rows[0].total));
  const banner=top.length>1?`It's a tie! Moo-off: ${top.map(r=>esc(r.name)).join(" vs. ")}`:`🏆 The Golden Calf Award goes to ${esc(rows[0].name)}!`;
  const tbl=`<table class="${tv?"tv-board":""}"><tr><th>CONTESTANT</th><th>REALISM</th><th>PASSION</th><th>HERD</th><th>TOTAL</th></tr>${rows.map((r,i)=>`<tr class="${i===0?"first":""}"><td class="n">${i+1}. ${esc(r.name)}</td><td>${fmt(r.realism)}</td><td>${fmt(r.passion)}</td><td>${fmt(r.herd)}</td><td class="tot">${fmt(r.total)}</td></tr>`).join("")}</table>`;
  return tv?`<div class="tv-win">${banner}</div>${tbl}`:`<div class="win"><div class="big">${banner}</div></div><div class="card">${tbl}<div class="muted" style="margin-top:8px">Each category is the average of everyone's 1 to 5 rating. Total is out of 15.</div></div>`;
}

// ---------- host ----------
function hostScreen(){
  if(!hostOK){ app.innerHTML=`<div class="hero"><h1>🐄 MOO HOST</h1></div><div class="card">This screen is for hosts. Open your own host RSVP link on this phone first, then come back here.<div style="margin-top:10px"><a href="../" style="color:var(--red);font-weight:700">Go to the RSVP page</a></div></div>`; return; }
  const by={}; (board||[]).forEach(r=>by[r.id]=r);
  const o=openCow();
  let h=`<div class="hero"><h1>🐄 MOO HOST</h1><div class="sub">${o?`Voting is open for ${esc(o.name)}`:"No voting open right now"}</div></div>
  <div class="hostbar"><b>Results are ${revealed?"SHOWING on every screen":"hidden from guests"}</b>
    <div class="row3"><button id="rev" class="${revealed?"":"go"}">${revealed?"Hide results":"🏆 Reveal results"}</button><a href="./?tv" target="_blank" rel="noopener">TV screen</a><a href="./">Guest view</a></div></div>
  <div class="card"><label for="add" style="margin-top:0">Add a contestant</label><div class="row"><input id="add" maxlength="40" placeholder="Name" autocomplete="off"><button id="addb">Add</button></div></div>
  <h2>Contestants</h2><div class="card">${cows.length?cows.map(c=>{ const r=by[c.id];
    return `<div class="li" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><div class="nm">${esc(c.name)}<span class="badge ${c.status}">${c.status==="open"?"VOTING OPEN":c.status==="closed"?"CLOSED":"WAITING"}</span></div>
      <div class="r">${counts[c.id]||0} vote${(counts[c.id]||0)===1?"":"s"}${r&&r.votes?` · ${fmt(r.total)} / 15`:""}</div></div>
      ${r&&r.votes?`<div class="muted">Realism ${fmt(r.realism)} · Passion ${fmt(r.passion)} · Herd Appeal ${fmt(r.herd)}</div>`:""}
      <div class="acts">${c.status==="open"?`<button class="sec" data-s="closed" data-id="${c.id}">■ Close voting</button>`:`<button class="go" data-s="open" data-id="${c.id}">▶ ${c.status==="closed"?"Reopen":"Open"} voting</button>`}<button class="sec" data-s="removed" data-id="${c.id}" data-n="${esc(c.name)}">Remove</button></div></div>`; }).join(""):`<div class="muted">Nobody yet. Add your first cow above.</div>`}</div>
  <div class="muted" style="color:#fff;opacity:.85">Opening voting for one contestant closes it for the one before. Only hosts see scores until you reveal them.</div>
  <div style="text-align:center"><a class="back" href="../">← Back to the RSVP page</a></div>`;
  const keep=$("add")?.value||"", had=document.activeElement?.id==="add";
  app.innerHTML=h; $("add").value=keep; if(had) $("add").focus();
  const act=async(fn,args,msg)=>{ const { error }=await sb.rpc(fn,{p_token:hostTok,...args}); if(error) toast(error.message); else if(msg) toast(msg); await load(); render(); };
  const add=async()=>{ const n=$("add").value.trim(); if(!n) return; $("add").value=""; await act("moo_add",{p_name:n},`${n} added`); };
  $("addb").onclick=add; $("add").onkeydown=e=>{ if(e.key==="Enter") add(); };
  $("rev").onclick=()=>act("moo_reveal",{p_revealed:!revealed},revealed?"Results hidden":"Results revealed!");
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    if(b.dataset.s==="removed" && !confirm(`Remove ${b.dataset.n} and their ratings from the cowpetition?`)) return;
    act("moo_set_status",{p_id:b.dataset.id,p_status:b.dataset.s});
  });
}

// ---------- TV ----------
const MOO_SRC=[1,2,3,4,5].map(i=>"../bingo/moo/moo"+i+".mp3?v=5");
const mooEl=new Audio(); mooEl.preload="auto"; let soundOK=false, lastRevealed;
function playMoo(){ mooEl.src=MOO_SRC[Math.floor(Math.random()*MOO_SRC.length)]; const p=mooEl.play(); if(p) p.then(()=>{ soundOK=true; syncSound(); }).catch(()=>{ soundOK=false; syncSound(); }); }
function syncSound(){ let b=$("sound"); if(soundOK){ b?.remove(); return; } if(!b){ b=document.createElement("button"); b.id="sound"; b.textContent="🔊 Tap to turn on the moo"; b.onclick=playMoo; document.body.appendChild(b); } }
function tvScreen(){
  const o=openCow(); const url=`<div class="tv-url">Rate the moos on your phone: <b>${location.host}${location.pathname.replace(/index\.html$/,"")}</b></div>`;
  let h=`<div class="tv-title">🐄 THE MOO COWPETITION</div>`;
  if(revealed) h+=results(true);
  else if(o) h+=`<div class="tv-eyebrow">NOW MOOING</div><div class="tv-name">${esc(o.name)}</div><div class="tv-sub">${counts[o.id]||0} rating${(counts[o.id]||0)===1?"":"s"} in · Realism · Passion · Herd Appeal</div>${url}`;
  else h+=`<div class="tv-eyebrow">${cows.length?"NEXT COW, PLEASE":"WARM UP THOSE MOOS"}</div><div class="tv-sub">${cows.filter(c=>c.status==="closed").map(c=>esc(c.name)).join(" · ")||"Winner takes home the Golden Calf Award"}</div>${url}`;
  app.innerHTML=h;
  if(lastRevealed===false && revealed && soundOK) playMoo();
  lastRevealed=revealed; syncSound();
}

function render(){ if(isTV) return tvScreen(); if(isHost) return hostScreen(); if(typing) return; voterScreen(); }

(async()=>{
  if(isHost && hostTok){ const { data }=await sb.rpc("host_check",{p_token:hostTok}); hostOK=!!data; }
  if(!isHost && !isTV && !myName && hostTok){ const { data }=await sb.rpc("rsvp_get",{p_token:hostTok}); if(data?.name){ myName=data.name; ls.set("sg_name",myName); } }
  const ok=await load(); render();
  if(!ok) toast("Can't reach the server. Still trying…");
  let t; const refresh=()=>{ clearTimeout(t); t=setTimeout(async()=>{ if(busy) return; if(await load()) render(); },150); };
  sb.channel("moo-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"moo_contestants"},refresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"moo_state"},refresh)
    .subscribe();
  setInterval(refresh,4000);   // vote counts, and a fallback if the live connection drops
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); });
})();
</script>
</body>
</html>
